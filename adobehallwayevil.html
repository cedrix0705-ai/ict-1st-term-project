<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hallway</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hotspot {
    position: absolute;
    display: block;
    background: rgba(255, 0, 0, 0);
}

.large-hitbox {
    top: 90%;
    width: 100%;
    height: 10%;
}

.small-hitbox {
    left: 20%;
    top: 57%;
    width: 64%;
    height: 70px;
}

</style>
</head>

<body>

<div class="scene">

    <img src="body.jpg" class="background">

    <a href="adobehallwayevildeath.html" class="hotspot small-hitbox"></a>

</div>

</body>
</html>
