<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hallway</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hotspot {
    position: absolute;
    display: block;
    background: rgba(255, 0, 0, 0);
}

.large-hitbox {
    left: 45%;
    top: 65%;
    width: 33%;
    height: 20%;
}
.hotspot-text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    color: black;
    text-align: center;
    font-family: "Times New Roman", serif;
    font-size: 1.2vw;
    line-height: 1.4;
    pointer-events: none;
    z-index: 2;
}

</style>
</head>

<body>

<div class="scene">

    <img src="https://imgur.com/rSOrDHp.jpg" class="background">

    <a href="apartmentpenta2puzzle1.html" class="hotspot large-hitbox"></a>


</div>

</body>
</html>
