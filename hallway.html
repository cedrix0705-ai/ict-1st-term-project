<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">


<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
        min-width:100%;
    min-height:100%;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hotspot {
    position: absolute;
    display: block;
    background: rgba(255, 0, 0, 0);

}

.small-hitbox {
    left: 78%;
    top: 10%;
    width: 15%;
    height: 80%;
}

</style>
</head>

<body>

<div class="scene">

    <img src="https://imgur.com/70j7mxR.jpg" class="background">
    <a href="classroom.html" class="hotspot small-hitbox"></a>

        <a href="hallway.html" class="hotspot large-hitbox"></a>

</div>

</body>
</html>
