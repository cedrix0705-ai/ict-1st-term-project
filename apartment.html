<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hallway</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hotspot {
    position: absolute;
    display: block;
    background: rgba(255, 0, 0, 0);
}

.large-hitbox {
    left: 25%;
    top: 55%;
    width: 65%;
    height: 50%;
}

.small-hitbox {
    left: 9%;
    top: 0%;
    width: 10%;
    height: 15%;
}

</style>
</head>

<body>

<div class="scene">

    <img src="https://imgur.com/6iLwkqc.jpg" class="background">

    <a href="apartmentpenta.html" class="hotspot large-hitbox"></a>

    <a href="apartment2.html" class="hotspot small-hitbox"></a>

</div>

</body>
</html>
