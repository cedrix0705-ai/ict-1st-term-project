<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hallway</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hotspot {
    position: absolute;
    display: block;
    background: rgba(255, 0, 0, 0);
}

.large-hitbox {
    top: 80%;
    width: 100%;
    height: 20%;
}
.continue-hitbox {
    top: 45%;
    left:50%;
    right:30%;
    width: 20%;
    height: 20%;
}


</style>
</head>

<body>

<div class="scene">

    <img src="https://imgur.com/XPUmxrr.jpg" class="background">

    <a href="classroom.html" class="hotspot large-hitbox"></a>

    <a href="playground.html" class="hotspot continue-hitbox"></a>

</div>

</body>
</html>
