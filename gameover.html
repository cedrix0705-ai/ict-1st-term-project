<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Over</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: black;
}

.background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: fadeout 2s ease forwards;
    animation-delay: 2s;
}

.message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    font-family: "Times New Roman", serif;
    text-align: center;
    opacity: 0;
    animation: appear 0.5s ease forwards;
    animation-delay: 4s;
}

.message h1 {
    margin: 0 0 15px 0;
    font-size: 28px;
    letter-spacing: 3px;
}

.message p {
    margin: 0;
    font-size: 16px;
}

@keyframes fadeout {
    from {
        opacity: 1;
    }
    to {
        opacity: 0;
    }
}

@keyframes appear {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="scene">

    <img src="body.png" class="background">

    <div class="message">
        <h1>YOU WERE TOO LATE.</h1>
        <p>The presence was not contained.</p>
        <p>ELIAS VILLAREAL — CASE #0017</p>
        <p>Turn off the monitor to restart.</p>
    </div>

</div>

</body>
</html>
